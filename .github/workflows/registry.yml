name: Registry

# Реестр расширений: PR правит только исходники в extensions/ (и artifacts/ для
# наших собственных расширений), публикуемый вид registry/v1/ собирает и коммитит
# этот воркфлоу после мержа. GitHub Pages раздаёт main как статику, поэтому
# «опубликовать» здесь буквально означает «закоммитить в main».

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "extensions/**"
      - "artifacts/**"
      - "scripts/registry.mjs"
      - ".github/workflows/registry.yml"

permissions:
  contents: read

jobs:
  # Событие именно pull_request, НЕ pull_request_target: --fetch ходит по URL из
  # присланного PR, и давать этому шагу токен на запись и секреты нельзя.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Без полной истории не разрешится `git show origin/<base>:…`, на котором
          # стоит проверка иммутабельности опубликованных версий.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm ci

      - name: Published view is generated
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^registry/'; then
            echo "::error::registry/ is generated by CI — a PR must only change extensions/ and artifacts/"
            exit 1
          fi

      - run: node scripts/registry.mjs validate --base "origin/${{ github.base_ref }}" --fetch

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Нужна база пуша (`github.event.before`) — от неё считаются новые версии.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm ci

      # Прямые коммиты в main минуют проверку на PR — валидируем ещё раз здесь, со
      # скачиванием версий, новых в этом пуше: без него pre-release (флаг виден
      # только в манифесте артефакта) прошёл бы мимо PR прямым коммитом. Удаления
      # здесь разрешены: снятие мейнтейнер решает на PR, а правку опубликованной
      # версии проверка иммутабельности ловит и так.
      - name: Validate
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            node scripts/registry.mjs validate --base "$BEFORE" --fetch --allow-removals
          else
            # Первый пуш или force-push: базы нет — проверяем все артефакты.
            node scripts/registry.mjs validate --fetch
          fi

      - run: node scripts/registry.mjs build

      - name: Commit published view
        run: |
          if [ -z "$(git status --porcelain registry)" ]; then
            echo "Nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry
          git commit -m "chore(registry): rebuild published view"
          # Пуш от GITHUB_TOKEN не ретриггерит воркфлоу — рекурсии здесь нет.
          git push
